<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 | REDUCE</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --green: #a3e635;
        --dark: #0c1a2e;
        --muted: rgba(255, 255, 255, 0.52);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 70% 60% at 10% 85%, rgba(163, 230, 53, 0.22), transparent 58%),
          radial-gradient(ellipse 55% 65% at 90% 10%, rgba(163, 230, 53, 0.1), transparent 52%),
          var(--dark);
        color: white;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 720px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(163, 230, 53, 0.25);
        border-radius: 999px;
        background: rgba(163, 230, 53, 0.07);
        color: var(--green);
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 800;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 12px rgba(163, 230, 53, 0.9);
      }
      h1 {
        margin: 34px 0 18px;
        font-size: clamp(4rem, 20vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
      h1 span {
        display: block;
        font-size: clamp(2.25rem, 10vw, 4.75rem);
        color: var(--green);
      }
      p {
        max-width: 560px;
        margin: 0 0 32px;
        color: var(--muted);
        font-size: clamp(1rem, 4vw, 1.125rem);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        border-radius: 999px;
        background: var(--green);
        color: var(--dark);
        padding: 0 28px;
        text-decoration: none;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge"><span class="dot"></span>Error 404 · Ruta no localizada</div>
      <h1>404<span>fuera de lectura.</span></h1>
      <p>Esta dirección no está dentro del mapa operativo de REDUCE. En unos instantes te llevamos a la experiencia principal.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
